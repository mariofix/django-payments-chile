name: New Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  crosscheck:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        django-version: ["5.1"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Tox tests
        run: |
          uv run tox -v
        env:
          DJANGO: ${{ matrix.django-version }}

  docs:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        poetry-version: ["1.8.3"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    needs: crosscheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set Up Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
        with:
          poetry-version: ${{ matrix.poetry-version }}
      - name: Setup Latest Poetry
        run: pipx install --suffix @main 'poetry @ git+https://github.com/python-poetry/poetry'
      - name: Install django-payments-chile
        run: poetry@main install --all-extras --all-groups
      - name: Deploy Docs
        run: poetry@main run mkdocs gh-deploy --force

  pypi-publish:
    name: Build and Upload
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        poetry-version: ["1.8.3"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    needs: crosscheck
    environment:
      name: pypi
      url: https://pypi.org/p/django-payments-chile
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - name: Set Up Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - name: Setup Latest Poetry
        run: pipx install --suffix @main 'poetry @ git+https://github.com/python-poetry/poetry'
      - name: Install django-payments-chile
        run: poetry@main install --all-extras --all-groups
      - name: Build django-payments-chile
        run: poetry@main build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
